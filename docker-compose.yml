services:
  # GitHub webhook → SQS only (queuing Lambda locally via Probot + smee)
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-webhook
    command: ["npm", "run", "start:webhook"]
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      DYNAMODB_TABLE_NAME: pull-request-state
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/queue/aegis-events
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    env_file:
      - .env
    networks:
      - bot
    profiles:
      - app

  # SQS → processor Lambda (local ElasticMQ long-poll adapter)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-worker
    command: ["npm", "run", "start:worker"]
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    environment:
      NODE_ENV: development
      DYNAMODB_TABLE_NAME: pull-request-state
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/queue/aegis-events
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    env_file:
      - .env
    networks:
      - bot
    profiles:
      - app

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: aegis-dynamodb
    command:
      - "-jar"
      - "DynamoDBLocal.jar"
      - "-sharedDb"
      - "-inMemory"
    ports:
      - "8000:8000"
    networks:
      - bot
    profiles:
      - test
      - app

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: aegis-dynamodb-init
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DynamoDB..."

        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do
          sleep 1
        done

        echo "Creating DynamoDB table..."

        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name pull-request-state \
          --attribute-definitions \
            AttributeName=repository,AttributeType=S \
            AttributeName=pull_request_number,AttributeType=N \
          --key-schema \
            AttributeName=repository,KeyType=HASH \
            AttributeName=pull_request_number,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          || true

        echo "DynamoDB tables:"
        aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000
    networks:
      - bot
    profiles:
      - test
      - app

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: aegis-elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    networks:
      - bot
    profiles:
      - test
      - app

networks:
  bot:
    driver: bridge
