services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merge-conflict-bot
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # Required so the process accepts traffic from Docker port publishing
      # and from a host-side smee client.
      HOST: "0.0.0.0"
      # App code reads DYNAMODB_TABLE_NAME; keep both for safety.
      DYNAMODB_TABLE_NAME: pull-request-state
    env_file:
      - .env
    networks:
      - bot
    profiles:
      - app

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: merge-conflict-bot-dynamodb
    command:
      - "-jar"
      - "DynamoDBLocal.jar"
      - "-sharedDb"
      - "-inMemory"
    ports:
      - "8000:8000"
    networks:
      - bot
    profiles:
      - test
      - app

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: merge-conflict-bot-dynamodb-init
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DynamoDB..."

        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do
          sleep 1
        done

        echo "Creating DynamoDB table..."

        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name pull-request-state \
          --attribute-definitions \
            AttributeName=repository,AttributeType=S \
            AttributeName=pull_request_number,AttributeType=N \
          --key-schema \
            AttributeName=repository,KeyType=HASH \
            AttributeName=pull_request_number,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          || true

        echo "DynamoDB tables:"
        aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000
    networks:
      - bot
    profiles:
      - test
      - app

networks:
  bot:
    driver: bridge
